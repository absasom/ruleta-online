<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ruleta - Jugador</title>
<style>
body {
  font-family: Arial;
  background: #111;
  color: #fff;
  text-align: center;
}
h1 { color: #ffcc00; }
#panel {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  margin: 20px auto;
  max-width: 800px;
  gap: 0.5cm;     /* 0.5 cm entre casillas */
}
.cuadro {
  width: 50px;
  height: 50px;
  margin: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  background: #222;
  border: 2px solid #444;
  border-radius: 5px;
}
#pista {
  margin: 15px auto;
  font-size: 20px;
  color: #00ffcc;
}
#marcadores {
  margin-top: 20px;
  font-size: 20px;
}
</style>
</head>
<body>

<h1>🎡 Ruleta de la Suerte</h1>

<div id="panel"></div>

<!-- Pista debajo del panel -->
<div id="pista"></div>

<!-- Marcadores de dinero -->
<div id="marcadores">
  Jugador 1: <span id="p1">0</span>€ | 
  Jugador 2: <span id="p2">0</span>€
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const panelDiv = document.getElementById("panel");
const pistaDiv = document.getElementById("pista");
const p1Span = document.getElementById("p1");
const p2Span = document.getElementById("p2");

function actualizarPanel(palabras) {
  panelDiv.innerHTML = "";

  palabras.forEach((palabra, i) => {
    // Crear contenedor para cada palabra
    const wordDiv = document.createElement("div");
    wordDiv.style.display = "flex";   // casillas juntas dentro de la palabra
    wordDiv.style.marginRight = "0.5cm"; // 0.5 cm entre palabras

    for (const l of palabra) {
      const div = document.createElement("div");
      div.className = "cuadro";
      div.textContent = l;
      wordDiv.appendChild(div);
    }

    panelDiv.appendChild(wordDiv);
  });
}

// Escuchar estado y pista
socket.on("estado", (data) => {
  actualizarPanel(data.panel);
  p1Span.textContent = data.p1;
  p2Span.textContent = data.p2;
});

socket.on("pista", (texto) => {
  pistaDiv.textContent = texto;
});
</script>

</body>
</html>

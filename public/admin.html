<!DOCTYPE html>
<html>
<body>

<h1>🎛️ CONTROL</h1>

<h3>Frase</h3>
<input id="frase" placeholder="Frase">
<button onclick="nuevaFrase()">Crear</button>

<hr>

<h3>Revelar letra</h3>
<input id="letra" maxlength="1">
<button onclick="revelar()">Revelar</button>

<hr>

<h3>Dinero manual</h3>
<input id="cantidad" type="number" placeholder="Cantidad (€)">
<br><br>
<button onclick="sumar(1)">Jugador 1</button>
<button onclick="sumar(2)">Jugador 2</button>

<hr>

<h3>Acciones rápidas</h3>

<button onclick="consonante(1)">J1 Consonante (-25€)</button>
<button onclick="vocal(1)">J1 Vocal (-50€)</button>

<br><br>

<button onclick="consonante(2)">J2 Consonante (-25€)</button>
<button onclick="vocal(2)">J2 Vocal (-50€)</button>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

function nuevaFrase() {
  socket.emit("nuevaFrase", document.getElementById("frase").value);
}

function revelar() {
  socket.emit("revelarLetra", document.getElementById("letra").value);
}

function sumar(jugador) {
  const cantidad = parseInt(document.getElementById("cantidad").value) || 0;
  socket.emit("sumarDinero", { jugador, cantidad });
}

function consonante(jugador) {
  socket.emit("sumarDinero", { jugador, cantidad: -25 });
}

function vocal(jugador) {
  socket.emit("sumarDinero", { jugador, cantidad: -50 });
}
</script>

</body>
</html>

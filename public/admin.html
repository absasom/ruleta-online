<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ruleta - Admin</title>
<style>
body {
  font-family: Arial;
  background: #222;
  color: #fff;
  text-align: center;
}
input { font-size: 16px; padding: 5px; margin: 5px; width: 200px; }
button { font-size: 16px; padding: 5px 10px; margin: 5px; }
#revelarTodoBtn {
  background: #ff4444;
  color: white;
  font-weight: bold;
  padding: 10px 20px;
  font-size: 18px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
#revelarTodoBtn:hover {
  background: #cc3333;
}
</style>
</head>
<body>

<h1>🎛 Admin Ruleta</h1>

<!-- Frase -->
<h3>Frase</h3>
<input id="fraseInput" placeholder="Escribe la frase">
<button onclick="enviarFrase()">Actualizar frase</button>

<!-- Pista -->
<h3>Pista</h3>
<input id="pistaInput" placeholder="Escribe la pista">
<button onclick="enviarPista()">Actualizar pista</button>

<!-- Botones de letras -->
<h3>Revelar Letra</h3>
<input id="letraInput" placeholder="Letra">
<button onclick="revelarLetra()">Revelar</button>

<!-- NUEVO BOTÓN REVELAR TODO -->
<h3>Panel Completo</h3>
<button id="revelarTodoBtn" onclick="revelarTodo()">🔓 REVELAR TODO</button>

<!-- Botones de dinero -->
<h3>Dinero</h3>
Jugador 1: <button onclick="sumarDinero(1, -25)">-25€</button> <button onclick="sumarDinero(1, -50)">-50€</button><br>
Jugador 2: <button onclick="sumarDinero(2, -25)">-25€</button> <button onclick="sumarDinero(2, -50)">-50€</button>

<!-- CAMPO NUEVO PARA AÑADIR DINERO -->
<h3>Añadir Dinero</h3>
<input id="dineroInput" type="number" placeholder="Cantidad €">
<select id="jugadorSelect">
  <option value="1">Jugador 1</option>
  <option value="2">Jugador 2</option>
</select>
<button onclick="anadirDineroPersonalizado()">Añadir</button>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

function enviarFrase() {
  const texto = document.getElementById("fraseInput").value;
  socket.emit("nuevaFrase", texto);
}

function enviarPista() {
  const texto = document.getElementById("pistaInput").value;
  socket.emit("cambiarPista", texto);
}

function revelarLetra() {
  const letra = document.getElementById("letraInput").value;
  if(letra) socket.emit("revelarLetra", letra[0]);
}

// NUEVA FUNCIÓN: Revelar todas las letras únicas de la frase
function revelarTodo() {
  // Solicitar al servidor todas las letras únicas
  socket.emit("revelarTodo");
  
  // Confirmación visual
  const btn = document.getElementById("revelarTodoBtn");
  const originalText = btn.textContent;
  btn.textContent = "✅ REVELADO";
  btn.style.background = "#44ff44";
  
  setTimeout(() => {
    btn.textContent = originalText;
    btn.style.background = "#ff4444";
  }, 2000);
}

function sumarDinero(jugador, cantidad) {
  socket.emit("sumarDinero", { jugador, cantidad });
}

function anadirDineroPersonalizado() {
  const cantidad = parseInt(document.getElementById("dineroInput").value);
  const jugador = parseInt(document.getElementById("jugadorSelect").value);
  if (!isNaN(cantidad)) {
    socket.emit("sumarDinero", { jugador, cantidad });
    document.getElementById("dineroInput").value = "";
  }
}
</script>

</body>
</html>
